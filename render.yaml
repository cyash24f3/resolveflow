# One free web instance; API and worker remain separate supervised processes.
# Persistent state lives in a separately provisioned Neon Free Plan database.
services:
  - type: web
    name: resolveflow
    runtime: python
    repo: https://github.com/cyash24f3/resolveflow
    branch: main
    plan: free
    region: ohio
    buildCommand: pip install uv==0.10.4 && uv sync --frozen --no-dev
    startCommand: .venv/bin/python -m resolveflow.hosted
    healthCheckPath: /api/v1/ready
    maxShutdownDelaySeconds: 130
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPERATOR_PASSWORD
        generateValue: true
      - key: SUPERVISOR_PASSWORD
        generateValue: true
      - key: DEVELOPER_PASSWORD
        generateValue: true
      - key: REMOTE_DEPLOYMENT
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_READ_ONLY
        value: "false"
      - key: PROVIDER_ENABLED
        value: "true"
      - key: PROVIDER_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: PROVIDER_MODEL
        value: "gemini-3.8-flash"
      - key: PROVIDER_FALLBACK_MODELS
        value: '["gemini-3.6-flash","gemini-3.5-flash-lite"]'
      - key: PROVIDER_API_KEY
        sync: false
      - key: PROVIDER_REASONING_EFFORT
        value: "medium"
      - key: PROVIDER_MAX_OUTPUT_TOKENS
        value: "4096"
      - key: PROVIDER_MIN_INTERVAL_SECONDS
        value: "6"
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_IDLE_SECONDS
        value: "5"
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "1"
