[project]
name = "resolveflow"
version = "0.1.0"
description = "A reliable support operations agent in a fictional business sandbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4", "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4", "httpx>=0.28,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1", "itsdangerous>=2.2,<3"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "playwright>=1.50,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/resolveflow"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an explicitly configured free/local provider", "postgres: requires PostgreSQL"]
